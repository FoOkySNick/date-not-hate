services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: date_not_hate
      POSTGRES_USER: date_not_hate
      POSTGRES_PASSWORD: date_not_hate
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
volumes:
  postgres_data:
