services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-date_not_hate}
      POSTGRES_USER: ${POSTGRES_USER:-date_not_hate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-date_not_hate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-date_not_hate}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_URL: ${APP_URL:?Set APP_URL to your public HTTPS domain in .env}
      FRONTEND_ORIGIN: ${APP_URL}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?Set VAPID_SUBJECT in .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Set VAPID_PUBLIC_KEY in .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Set VAPID_PRIVATE_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - photos_data:/app/backend/photos

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST to your public domain in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  postgres_data:
  photos_data:
  caddy_data:
  caddy_config:
